<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ARCHIVE</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #141319;
  font-family: sans-serif;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
}

#opening {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #141319;
}

#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

#appleTarget {
  position: absolute;
  left: 52%;
  top: 67.5%;
  width: 120px;
  height: 120px;
  transform: translate(-50%, -50%);
  border: none;
  outline: none;
  background: transparent;
  border-radius: 50%;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}

#appleTarget:focus {
  outline: none;
}

#appleTarget::before,
#appleTarget::after {
  content: "";
  position: absolute;
  inset: 25%;
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  pointer-events: none;
  animation: ripple 2.6s ease-out infinite;
}

#appleTarget::after {
  animation-delay: 1.3s;
}

@keyframes ripple {
  0% {
    transform: scale(0.7);
    opacity: 0.8;
  }
  100% {
    transform: scale(2.2);
    opacity: 0;
  }
}

#lobby {
  display: none;
  position: fixed;
  inset: 0;
  overflow-y: auto;
  padding: 60px 22px;
  color: #f6f1f4;
  background: #141319;
  text-align: center;
  touch-action: pan-y;
}

#lobby h1 {
  margin-top: 20vh;
  font-size: 25px;
  font-weight: normal;
  letter-spacing: 5px;
}

#lobby p {
  color: #aaa3b3;
  font-size: 12px;
  letter-spacing: 3px;
}

#lobby nav {
  max-width: 400px;
  margin: 50px auto;
}

#lobby nav button {
  width: 100%;
  margin: 7px 0;
  padding: 20px;
  color: white;
  background: transparent;
  border: 1px solid #494451;
  font-size: 14px;
}

#homeButton {
  position: absolute;
  top: 20px;
  left: 20px;
  width: auto;
  margin: 0;
  padding: 10px 14px;
  color: #c9c2ce;
  background: transparent;
  border: 1px solid #494451;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<section id="opening">
  <img id="scene" alt="">
  <button id="appleTarget" aria-label="りんごをタップ"></button>
</section>

<section id="lobby">
  <button id="homeButton">← HOME</button>

  <p>PRIVATE COLLECTION</p>
  <h1>ARCHIVE</h1>
  <p>CHARACTERS / STORIES / WORLDS</p>

  <nav>
    <button onclick="alert('キャラクター資料はこれから追加します')">CHARACTERS</button>
    <button onclick="alert('物語の資料はこれから追加します')">STORIES</button>
    <button onclick="alert('世界観の資料はこれから追加します')">WORLDS</button>
  </nav>
</section>

<script>
const images = [
  "IMG_3320.png",
  "無題290_20261027070018.png",
  "無題290_20261027075250.png",
  "無題290_20261027081745.png"
];

const opening = document.getElementById("opening");
const scene = document.getElementById("scene");
const appleTarget = document.getElementById("appleTarget");
const lobby = document.getElementById("lobby");
const homeButton = document.getElementById("homeButton");

let currentIndex = 0;
let loading = true;

function loadImage(index) {
  loading = true;
  appleTarget.disabled = true;

  scene.onload = function() {
    loading = false;
    appleTarget.disabled = false;
  };

  scene.onerror = function() {
    loading = true;
    appleTarget.disabled = true;
    alert("画像が読み込めませんでした。ファイル名を確認してください。");
  };

  scene.src = images[index];
}

appleTarget.addEventListener("click", function(event) {
  event.preventDefault();
  event.stopPropagation();

  if (loading) return;

  if (currentIndex < images.length - 1) {
    currentIndex++;
    loadImage(currentIndex);
  } else {
    opening.style.display = "none";
    lobby.style.display = "block";
  }
});

homeButton.addEventListener("click", function() {
  lobby.style.display = "none";
  opening.style.display = "block";
  currentIndex = 0;
  loadImage(currentIndex);
});

loadImage(currentIndex);
</script>
</body>
</html>
