<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>創作アーカイブ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101116;
      color: #eeeaf2;
      font-family: sans-serif;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid #393743;
    }

    header p {
      color: #aaa5b8;
      letter-spacing: 3px;
      font-size: 11px;
    }

    h1 {
      font-size: 25px;
      letter-spacing: 4px;
      font-weight: normal;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 24px 18px;
    }

    .intro {
      padding: 28px 20px;
      border: 1px solid #484352;
      background: #191820;
      margin-bottom: 30px;
    }

    .intro p {
      color: #c1bbc9;
      line-height: 1.9;
      font-size: 14px;
    }

    h2 {
      font-size: 16px;
      font-weight: normal;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .menu {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 20px;
      color: #eeeaf2;
      background: #191820;
      border: 1px solid #484352;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }

    button span {
      display: block;
      color: #9d96aa;
      font-size: 12px;
      margin-top: 8px;
    }

    button:active {
      background: #302a3a;
    }

    #detail {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border: 1px solid #484352;
      line-height: 1.9;
    }

    .back {
      margin-top: 16px;
      text-align: center;
    }

    footer {
      padding: 30px 15px;
      color: #777180;
      text-align: center;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <header>
    <p>PRIVATE COLLECTION</p>
    <h1>創作アーカイブ</h1>
    <p>CHARACTERS / STORIES / WORLDS</p>
  </header>

  <main>
    <section class="intro">
      <h2>WELCOME TO MY ARCHIVE</h2>
      <p>
        物語と登場人物の記録。<br>
        ここに、私だけの創作世界を保管する。
      </p>
    </section>

    <h2>ARCHIVE INDEX</h2>

    <div class="menu">
      <button onclick="showDetail('characters')">
        01　CHARACTERS
        <span>創作キャラクター・人物設定</span>
      </button>

      <button onclick="showDetail('stories')">
        02　STORIES
        <span>物語・プロット・あらすじ</span>
      </button>

      <button onclick="showDetail('worlds')">
        03　WORLDS
        <span>世界観・用語・設定資料</span>
      </button>
    </div>

    <section id="detail">
      <h2 id="detailTitle"></h2>
      <p id="detailText"></p>
      <button class="back" onclick="hideDetail()">← INDEX に戻る</button>
    </section>
  </main>

  <footer>
    MY CREATIVE ARCHIVE
  </footer>

  <script>
    const contents = {
      characters: {
        title: "CHARACTERS",
        text: "ここに創作キャラクターのプロフィールを追加していきます。"
      },
      stories: {
        title: "STORIES",
        text: "ここに物語のあらすじやプロットを追加していきます。"
      },
      worlds: {
        title: "WORLDS",
        text: "ここに世界観や用語、設定資料を追加していきます。"
      }
    };

    function showDetail(type) {
      document.getElementById("detailTitle").textContent =
        contents[type].title;
      document.getElementById("detailText").textContent =
        contents[type].text;
      document.getElementById("detail").style.display = "block";
      document.getElementById("detail").scrollIntoView({
        behavior: "smooth"
      });
    }

    function hideDetail() {
      document.getElementById("detail").style.display = "none";
    }
  </script>

</body>
</html>
