<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #141319;
  font-family: sans-serif;
}

#opening {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#scene {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#message {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  text-align: center;
  font-size: 12px;
  letter-spacing: 3px;
  padding: 12px 24px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 2;
}

#message::before,
#message::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: 50%;
  animation: ripple 2.4s ease-out infinite;
  pointer-events: none;
}

#message::after {
  animation-delay: 1.2s;
}

@keyframes ripple {
  0% {
    transform: scale(0.85);
    opacity: 0.8;
  }

  100% {
    transform: scale(1.5, 2);
    opacity: 0;
  }
}

#message.loading::before,
#message.loading::after {
  display: none;
}

#lobby {
  display: none;
  min-height: 100vh;
  padding: 60px 22px;
  color: #f6f1f4;
  background: #141319;
  text-align: center;
}

#lobby h1 {
  margin-top: 20vh;
  font-size: 25px;
  font-weight: normal;
  letter-spacing: 5px;
}

#lobby p {
  color: #aaa3b3;
  font-size: 12px;
  letter-spacing: 3px;
}

#lobby nav {
  max-width: 400px;
  margin: 50px auto;
}

#lobby button {
  width: 100%;
  margin: 7px 0;
  padding: 20px;
  color: white;
  background: transparent;
  border: 1px solid #494451;
  font-size: 14px;
}
</style>
</head>

<body>

<section id="opening">
  <img id="scene" alt="タップして進む">
  <div id="message" class="loading">LOADING...</div>
</section>

<section id="lobby">
  <p>PRIVATE COLLECTION</p>
  <h1>ARCHIVE</h1>
  <p>CHARACTERS / STORIES / WORLDS</p>

  <nav>
    <button onclick="alert('キャラクター資料はこれから追加します')">
      CHARACTERS
    </button>

    <button onclick="alert('物語の資料はこれから追加します')">
      STORIES
    </button>

    <button onclick="alert('世界観の資料はこれから追加します')">
      WORLDS
    </button>
  </nav>
</section>

<script>
const images = [
  "IMG_3320.png",
  "無題290_20261027070018.png",
  "無題290_20261027075250.png",
  "無題290_20261027081745.png"
];

const opening = document.getElementById("opening");
const scene = document.getElementById("scene");
const message = document.getElementById("message");
const lobby = document.getElementById("lobby");

let currentIndex = 0;
let loading = false;

function loadImage(index) {
  loading = true;
  message.textContent = "LOADING...";
  message.classList.add("loading");

  scene.onload = function() {
    loading = false;
    message.textContent = "TAP TO CONTINUE";
    message.classList.remove("loading");
  };

  scene.onerror = function() {
    loading = true;
    message.textContent = "IMAGE ERROR";
    message.classList.add("loading");
  };

  scene.src = images[index];
}

opening.addEventListener("click", function() {
  if (loading) return;

  if (currentIndex < images.length - 1) {
    currentIndex++;
    loadImage(currentIndex);
  } else {
    opening.style.display = "none";
    lobby.style.display = "block";
  }
});

loadImage(currentIndex);
</script>

</body>
</html>
