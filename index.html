<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #141319;
  font-family: sans-serif;
}

#opening {
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  cursor: pointer;
}

#scene {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

#lobby {
  display: none;
  min-height: 100vh;
  padding: 60px 22px;
  color: #f6f1f4;
  background: #141319;
  text-align: center;
}

#lobby h1 {
  margin-top: 20vh;
  font-size: 25px;
  font-weight: normal;
  letter-spacing: 5px;
}

#lobby p {
  color: #aaa3b3;
  font-size: 12px;
  letter-spacing: 3px;
}

#lobby nav {
  max-width: 400px;
  margin: 50px auto;
}

#lobby button {
  width: 100%;
  margin: 7px 0;
  padding: 20px;
  color: white;
  background: transparent;
  border: 1px solid #494451;
  font-size: 14px;
}
</style>
</head>

<body>

<section id="opening">
  <img id="scene" src="IMG_3320.png" alt="タップして進む">
</section>

<section id="lobby">
  <p>PRIVATE COLLECTION</p>
  <h1>ARCHIVE</h1>
  <p>CHARACTERS / STORIES / WORLDS</p>

  <nav>
    <button onclick="alert('キャラクター資料はこれから追加します')">
      CHARACTERS
    </button>
    <button onclick="alert('物語の資料はこれから追加します')">
      STORIES
    </button>
    <button onclick="alert('世界観の資料はこれから追加します')">
      WORLDS
    </button>
  </nav>
</section>

<script>
const images = [
  "IMG_3320.png",
  "無題290_20261027070018.png",
  "無題290_20261027070623.png",
  "無題290_20261027073150.png"
];

let stage = 0;

const opening = document.getElementById("opening");
const scene = document.getElementById("scene");
const lobby = document.getElementById("lobby");

opening.addEventListener("click", () => {
  stage++;

  if (stage < images.length) {
    scene.src = images[stage];
  } else {
    opening.style.display = "none";
    lobby.style.display = "block";
  }
});
</script>

</body>
</html>
