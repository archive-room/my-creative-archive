<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
  font-family: sans-serif;
}

#opening {
  position: relative;
  width: 100%;
  height: 100svh;
  min-height: 500px;
  overflow: hidden;
  background: #fdfcfb;
}

#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

#apple {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 32%;
  height: 32%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

#apple img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#hint {
  position: absolute;
  bottom: 8%;
  left: 0;
  width: 100%;
  text-align: center;
  color: rgba(80, 70, 70, 0.55);
  font-size: 11px;
  letter-spacing: 4px;
}

#lobby {
  display: none;
  min-height: 100svh;
  padding: 60px 22px;
  color: #f6f1f4;
  background: #141319;
  text-align: center;
}

#lobby h1 {
  margin-top: 20vh;
  font-size: 25px;
  font-weight: normal;
  letter-spacing: 5px;
}

#lobby p {
  color: #aaa3b3;
  font-size: 12px;
  letter-spacing: 3px;
}

#lobby nav {
  max-width: 400px;
  margin: 50px auto;
}

#lobby button {
  width: 100%;
  margin: 7px 0;
  padding: 20px;
  color: white;
  background: transparent;
  border: 1px solid #494451;
  font-size: 14px;
}
</style>
</head>
<body>

<section id="opening">
  <img id="scene" src="IMG_3320.png" alt="">
  <div id="apple" role="button" aria-label="りんごをタップ">
    <img id="appleImage" src="IMG_3320.png" alt="">
  </div>
  <div id="hint"></div>
</section>

<section id="lobby">
  <p>PRIVATE COLLECTION</p>
  <h1>ARCHIVE</h1>
  <p>CHARACTERS / STORIES / WORLDS</p>
  <nav>
    <button onclick="alert('キャラクター資料はこれから追加します')">CHARACTERS</button>
    <button onclick="alert('物語の資料はこれから追加します')">STORIES</button>
    <button onclick="alert('世界観の資料はこれから追加します')">WORLDS</button>
  </nav>
</section>

<script>
let taps = 0;

const apple = document.getElementById('apple');
const opening = document.getElementById('opening');
const lobby = document.getElementById('lobby');

apple.addEventListener('click', () => {
  taps++;

  if (taps >= 4) {
    opening.style.display = 'none';
    lobby.style.display = 'block';
    return;
  }

  apple.style.transform =
    `translate(-50%, -50%) scale(${1 - taps * 0.12})`;

  apple.style.opacity = String(1 - taps * 0.18);
});
</script>

</body>
</html>
